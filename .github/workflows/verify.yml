name: Verify FocusFlow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run unit and smoke tests
        run: node --test tests/*.test.cjs
      - name: Build static application
        run: node scripts/build-static.mjs
      - name: Check deployable artifacts and credential patterns
        run: node scripts/check-static-artifacts.mjs
